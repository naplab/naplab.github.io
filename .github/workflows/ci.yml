name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll and Vite sites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll dependencies
        run: bundle install && bundle exec appraisal install

      - name: Set up GitHub Pages
        id: configure-pages
        uses: actions/configure-pages@v5

      - name: Build archived Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --destination _site/archive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new_website2/package-lock.json

      - name: Install academic website dependencies
        run: npm ci --prefix new_website2

      - name: Build academic Vite website
        run: npm run build --prefix new_website2

      - name: Assemble homepage, archive, and redirects
        run: node new_website2/scripts/prepare-pages.mjs

      - name: Verify Pages artifact
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/archive/index.html
          for page in research people publications teaching teaching/bci-lab opportunities gallery contact; do
            test -f "_site/$page/index.html"
            test -f "_site/new_website2/$page/index.html"
          done
          test -n "$(find _site/bundles -type f -name '*.js' -print -quit)"
          test -n "$(find _site/bundles -type f -name '*.css' -print -quit)"
          grep -q 'data-page="home"' _site/index.html
          grep -q '/archive/assets/css/beautifuljekyll.css' _site/archive/index.html
          grep -q '/archive/bci/' _site/archive/teaching/index.html
          test -f _site/img/people/jingting-zhang.jpg
          test -f _site/archive/assets/img/naplab_logo_small.png
          test -f _site/assets/files/finalbci.pdf

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll and Vite sites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll dependencies
        run: bundle install && bundle exec appraisal install

      - name: Set up GitHub Pages
        id: configure-pages
        uses: actions/configure-pages@v5

      - name: Create CI configuration
        run: |
          echo "---" > _config_ci.yml
          echo "baseurl: ${{ steps.configure-pages.outputs.base_path }}" >> _config_ci.yml

      - name: Build existing Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --config _config.yml,_config_ci.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            new_website/package-lock.json
            new_website2/package-lock.json

      - name: Install new website dependencies
        run: npm ci --prefix new_website

      - name: Build new Vite website
        run: npm run build --prefix new_website

      - name: Install academic website dependencies
        run: npm ci --prefix new_website2

      - name: Build academic Vite website
        run: npm run build --prefix new_website2

      - name: Add new website to Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site/new_website
          mkdir -p _site/new_website
          cp -a new_website/dist/. _site/new_website/
          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
          fi

      - name: Add academic website to Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site/new_website2
          mkdir -p _site/new_website2
          cp -a new_website2/dist/. _site/new_website2/

      - name: Verify Pages artifact
        run: |
          set -euo pipefail
          test -f _site/index.html
          for site in new_website new_website2; do
            test -f "_site/$site/index.html"
            for page in research people publications teaching opportunities gallery contact; do
              test -f "_site/$site/$page/index.html"
            done
            test -n "$(find "_site/$site/assets" -type f -name '*.js' -print -quit)"
            test -n "$(find "_site/$site/assets" -type f -name '*.css' -print -quit)"
          done

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
